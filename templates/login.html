<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>POS System — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;
  --accent:#e8622a;--accent2:#f09c6e;
  --text:#f0ede8;--text2:#a0998e;--text3:#5a534a;
  --border:#2e2e2e;--green:#2d7a3a;--r:14px;
}
body{min-height:100vh;background:var(--bg);font-family:'Plus Jakarta Sans',sans-serif;
  display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(232,98,42,.15),transparent);
}
.login-wrap{width:100%;max-width:420px;padding:20px;}
.logo{text-align:center;margin-bottom:36px;}
.logo h1{font-family:'Instrument Serif',serif;font-size:2.6rem;color:var(--text);letter-spacing:-.02em;}
.logo h1 span{color:var(--accent);}
.logo p{color:var(--text2);font-size:.88rem;margin-top:6px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:32px;}
{% with messages = get_flashed_messages() %}{% if messages %}
.alert{background:rgba(220,50,50,.12);border:1px solid rgba(220,50,50,.3);border-radius:8px;
  color:#f87171;font-size:.84rem;padding:10px 14px;margin-bottom:18px;}
{% endif %}{% endwith %}
.form-group{margin-bottom:18px;}
label{display:block;font-size:.78rem;font-weight:600;color:var(--text2);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:7px;}
input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;
  padding:11px 14px;color:var(--text);font-family:inherit;font-size:.92rem;outline:none;transition:.2s;}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,98,42,.15);}
.btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:12px;font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;
  transition:.15s;margin-top:4px;}
.btn:hover{background:#d4571f;transform:translateY(-1px);}
.hint{text-align:center;margin-top:18px;font-size:.78rem;color:var(--text3);}
.hint strong{color:var(--text2);}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo">
    <h1>POS<span>System</span></h1>
    <p>Sign in to manage your store</p>
  </div>
  <div class="card">
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="alert">{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}
    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="admin" required autocomplete="username"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn">Sign In →</button>
    </form>
  </div>
  <p class="hint">Default: <strong>admin</strong> / <strong>admin123</strong> — change after first login</p>
</div>
</body>
</html>
